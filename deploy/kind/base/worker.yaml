apiVersion: apps/v1
kind: Deployment
metadata:
  name: taf-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taf-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taf-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: codinglair/taf-worker:project-version
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["bash", "-c", "test -w /workspace && test -w /artifacts && kill -0 1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["bash", "-c", "kill -0 1"]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: artifacts
          emptyDir:
            sizeLimit: 1Gi
