name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-matrix:
    name: Complete release-blocking matrix
    uses: ./.github/workflows/verification-matrix.yml

  stage-community-release:
    name: Stage and verify community release
    needs: complete-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate documentation versions
        run: java build-support/scripts/SyncDocVersion.java --check
      - name: Verify clean public-repository checkout
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Stage community Maven artifacts
        run: ./mvnw -B -ntp clean deploy -Prelease-staging -Dproject.build.outputTimestamp="$(git show -s --format=%cI HEAD)"
      - name: Verify clean consumers from staged artifacts
        shell: pwsh
        run: ./build-support/verification/ver-132-001.ps1 -SkipStage
      - name: Retain packaged-consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: packaged-consumer-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ver-132-001/
            target/consumer-smoke/**/build.log
            target/consumer-smoke/**/target/surefire-reports/
            target/consumer-smoke/**/target/dependency-tree.txt
            target/consumer-smoke/**/target/effective-pom.xml
            target/consumer-smoke/**/target/allure-results/
            target/consumer-smoke/**/target/allure-report/
          if-no-files-found: error
          retention-days: 90
      - name: Verify release contract and staged evidence
        run: |
          mkdir -p target/release-contract
          javac -d target/release-contract build-support/release/ReleaseContractTest.java build-support/release/ReleaseLicensePolicy.java build-support/release/ReleaseLicensePolicyTest.java build-support/release/JacksonDependencyPolicyTest.java
          java -cp target/release-contract JacksonDependencyPolicyTest
          java -cp target/release-contract ReleaseLicensePolicyTest
          java -cp target/release-contract ReleaseContractTest target/staging-repository
          java -cp target/release-contract ReleaseLicensePolicy target/staging-repository
      - name: Scan every staged publication surface for Jackson vulnerabilities
        run: bash build-support/scripts/scan-jackson-surfaces.sh target/staging-repository target/dep-132-001
      - name: Retain staged repository
        uses: actions/upload-artifact@v4
        with:
          name: community-maven-staging-${{ github.sha }}-${{ github.run_attempt }}
          path: target/staging-repository/
          if-no-files-found: error
          retention-days: 30
      - name: Retain Jackson dependency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jackson-surface-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: target/dep-132-001/
          if-no-files-found: error
          retention-days: 90
      - name: Create ephemeral signing identity
        run: |
          gpg --batch --passphrase '' --quick-generate-key \
            'Codinglair TAF Release Validation <release-validation@invalid.example>' rsa3072 sign 1d
      - name: Validate signed Central bundle without upload
        run: ./mvnw -B -ntp clean deploy -Pcentral-publish -Dcentral.skipPublishing=true -Dproject.build.outputTimestamp="$(git show -s --format=%cI HEAD)"
      - name: Verify Central dry-run bundle
        run: |
          test -s target/central-publishing/central-bundle.zip
          unzip -Z1 target/central-publishing/central-bundle.zip > target/release-contract/central-bundle-files.txt
          test -s target/release-contract/central-bundle-files.txt
          ! grep -q '^com/codinglair/taf/demo/' target/release-contract/central-bundle-files.txt
          while IFS= read -r file; do
            case "$file" in
              *.pom|*.jar|*.json) grep -Fxq "${file}.asc" target/release-contract/central-bundle-files.txt ;;
            esac
          done < target/release-contract/central-bundle-files.txt
