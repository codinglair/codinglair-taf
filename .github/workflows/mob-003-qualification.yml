name: MOB-003 Candidate Qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mob-003-candidate-qualification
  cancel-in-progress: false

jobs:
  candidate-a:
    name: Candidate A pre-approval qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Enable runner KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Build exact Candidate A without cache
        shell: pwsh
        run: containers/android-emulator/google/build.ps1 -AcceptAndroidSdkLicense -Clean
      - name: Verify candidate and qualification contracts
        shell: pwsh
        run: |
          containers/android-emulator/google/verify.ps1
          containers/android-emulator/google/verify-compose.ps1
      - name: Run two clean real Appium smokes
        shell: pwsh
        run: containers/android-emulator/google/qualify.ps1 -Runs 2
      - name: Verify controlled-failure cleanup
        shell: pwsh
        run: containers/android-emulator/google/qualify.ps1 -Runs 1 -ControlledFailure
      - name: Tear down Candidate A
        if: ${{ always() }}
        run: docker compose --file containers/android-emulator/google/compose.qualify.yaml down --remove-orphans
      - name: Publish qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mob-003-candidate-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/mob-003/build-metadata.json
            target/mob-003/qualification/**
            codinglair-taf-runtime/taf-mobile-appium/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
