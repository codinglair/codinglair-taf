name: Gitleaks Secret Scanning

on:
  pull_request:
    branches:
      - 'master'
      - 'staging'
      - 'release-*'
      - 'release/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete public history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit introduced by the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh build-support/scripts/run-gitleaks.sh pr "$BASE_SHA" "$HEAD_SHA"
