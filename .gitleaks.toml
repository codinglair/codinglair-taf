[extend]
useDefault = true

# Exact CI fixture filename; this is a policy-test path label, not an API credential.
[[allowlists]]
description = "Image-policy API-level fixture filename"
regexTarget = "match"
regexes = ['''reject-prior-api34\.properties''']

# Exact published Android SDK archive checksum; checksums are integrity metadata.
[[allowlists]]
description = "Documented Android API 34 archive SHA-256"
regexTarget = "match"
regexes = ['''783a40134baf4f3012d4464fbe1571b1612a0dbd2e7a44d14bd8328923443833''']

# Exact secret-reference URI used to teach that resolved values must not be persisted.
[[allowlists]]
description = "Documentation-only environment secret reference"
regexTarget = "line"
regexes = ['''credential-reference=secret://env/ORDERS_API_TOKEN, outcome=FAILED''']

# Exact historical MCP contract fixture placeholder. The PR scanner examines every introduced
# commit, including the commit before this value was replaced with a low-entropy fixture value.
[[allowlists]]
description = "MCP AWS request idempotency fixture placeholder"
regexTarget = "match"
regexes = ['''idempotency-key-aws-1''']

# Exact synthetic marker used to prove that VER-120-002 retained evidence rejects canary values.
# The PR scanner examines the introducing commit as well as this repair commit, so renaming the
# marker cannot remove the historical match. This value is not a credential or accepted by a
# product boundary; default Gitleaks rules remain active for every other value.
[[allowlists]]
description = "VER-120-002 evidence leak-scan synthetic marker"
regexTarget = "match"
regexes = ['''ver-120-002-secret-canary-7dcb7f''']
